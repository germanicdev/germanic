name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@bc03af53cf480bff4d18769933dd6b465239e06e # cross

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p germanic
          else
            cargo build --release --target ${{ matrix.target }} -p germanic
          fi

      - name: Package
        run: |
          tar czf germanic-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release germanic

      - name: Checksum
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum germanic-${{ matrix.target }}.tar.gz \
              > germanic-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 germanic-${{ matrix.target }}.tar.gz \
              > germanic-${{ matrix.target }}.tar.gz.sha256
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: germanic-${{ matrix.target }}
          path: |
            germanic-${{ matrix.target }}.tar.gz
            germanic-${{ matrix.target }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            germanic-*.tar.gz
            germanic-*.tar.gz.sha256
          generate_release_notes: true
